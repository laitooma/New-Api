name: Bot trading - simulation quotidienne

# Simulation uniquement : aucune cle API, aucun argent reel.
# GitHub ne lance les workflows "schedule" que depuis la branche par defaut (main).
on:
  schedule:
    - cron: "23 0 * * *" # 00:23 UTC, juste apres la cloture journaliere
    # creneaux de secours : GitHub saute parfois des passages planifies ;
    # le bot ne trade qu'une fois par jour UTC, un 2e passage ne fait rien
    - cron: "37 3 * * *"
    - cron: "13 9 * * *"
  workflow_dispatch:

permissions:
  contents: write # pour enregistrer l'etat de la simulation dans le depot

concurrency:
  group: trading-bot-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    env:
      BOT_EXCHANGE: kraken # donnees publiques, accessibles depuis les serveurs GitHub
      BOT_QUOTE: USD
      BOT_STATE_DIR: paper_kraken
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Installer les dependances
        run: pip install pandas numpy requests ccxt

      - name: Passage du bot (simulation)
        working-directory: trading_bot
        run: |
          mkdir -p "$BOT_STATE_DIR"
          set -o pipefail # sans cela, un echec du script est masque par tee
          python bot.py | tee run.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat run.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer le resultat
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          # le dossier n'existe pas tant qu'aucun jour n'a ete enregistre
          if [ -d trading_bot/paper_kraken ]; then git add trading_bot/paper_kraken; fi
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Paper trading (Kraken) $(date -u +%F)"
            git pull --rebase
            git push
          fi
