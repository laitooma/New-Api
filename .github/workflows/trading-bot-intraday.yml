name: Bot trading - simulation day trading

# Simulation uniquement : aucune cle API, aucun argent reel.
# Strategie figee le 2026-11-07 (cassure Asie, achat+vente, sortie 20:00 UTC).
on:
  schedule:
    - cron: "11 21 * * *" # 21:11 UTC, la bougie de 20:00 est cloturee
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot-paper
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer les dependances
        run: pip install pandas numpy ccxt

      - name: Journee de day trading simulee
        working-directory: trading_bot
        run: |
          python intraday_paper.py | tee run.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat run.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer le resultat
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add trading_bot/paper_intraday
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Paper day trading $(date -u +%F)"
            git pull --rebase
            git push
          fi
