name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        run: pytest -v

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Construire l'image
        run: docker build -t new-api:ci .

      - name: Smoke test du conteneur
        run: |
          docker run -d --name api -p 8000:8000 new-api:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo " -> API OK"
              exit 0
            fi
            sleep 1
          done
          echo "L'API n'a pas repondu" >&2
          docker logs api
          exit 1
