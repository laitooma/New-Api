name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        run: pytest -v

  trading-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer les dependances du bot
        run: pip install pandas numpy pytest backtesting==0.6.4

      - name: Tests du bot (pas de lecture du futur, frais, arret d'urgence)
        working-directory: trading_bot
        run: python -m pytest -q tests

      - name: Rejeu du bot + controle croise avec backtesting.py
        working-directory: trading_bot
        run: |
          python bot.py --replay
          python crosscheck.py
          python intraday_paper.py --csv
          python universe_paper.py --csv

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Format (terraform fmt)
        run: terraform fmt -check -recursive

      # Pas de compte AWS ici : on verifie seulement que le code est valide
      - name: Init sans backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    # Droit d'ecrire dans GitHub Container Registry (ghcr.io) avec le GITHUB_TOKEN
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Construire l'image
        run: docker build -t new-api:ci .

      - name: Smoke test du conteneur
        run: |
          docker run -d --name api -p 8000:8000 new-api:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo " -> API OK"
              exit 0
            fi
            sleep 1
          done
          echo "L'API n'a pas repondu" >&2
          docker logs api
          exit 1

      # Publication : seulement apres un push sur main (jamais depuis une PR)
      - name: Connexion a ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publier l'image sur ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # ghcr.io exige un nom en minuscules : laitooma/New-Api -> laitooma/new-api
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag new-api:ci "$IMAGE:latest"
          docker tag new-api:ci "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push --all-tags "$IMAGE"
          echo "Image publiee : $IMAGE"
