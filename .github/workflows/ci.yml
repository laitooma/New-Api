name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule par defaut ; seul le job docker recoit en plus le droit
# de publier l'image (bloc permissions de ce job).
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        run: pytest -v

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.17.1"

      - name: Format (terraform fmt)
        run: terraform fmt -check -recursive

      # Pas de compte AWS ici : on verifie seulement que le code est valide
      - name: Init sans backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    # Droit d'ecrire dans GitHub Container Registry (ghcr.io) avec le GITHUB_TOKEN
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Construire l'image
        run: docker build --build-arg APP_VERSION="sha-${GITHUB_SHA::7}" -t devops-pipeline:ci .

      - name: Smoke test du conteneur
        run: |
          docker run -d --name api -p 8000:8000 devops-pipeline:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo " -> API OK"
              curl -fsS http://localhost:8000/version
              exit 0
            fi
            sleep 1
          done
          echo "L'API n'a pas repondu" >&2
          docker logs api
          exit 1

      # Publication : seulement apres un push sur main (jamais depuis une PR)
      - name: Connexion a ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publier l'image sur ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # ghcr.io exige un nom en minuscules (GITHUB_REPOSITORY peut contenir des majuscules)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag devops-pipeline:ci "$IMAGE:latest"
          docker tag devops-pipeline:ci "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push --all-tags "$IMAGE"
          echo "Image publiee : $IMAGE"
